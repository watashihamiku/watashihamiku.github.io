<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>かわいいノート風ページ</title>
<style>
body {
  font-family: "Rounded Mplus 1c", "メイリオ", sans-serif;
  background: #fff9fb;
  margin: 0;
  padding: 40px;
  color: #444;
}

.container {
  background: #ffffff;
  border: 2px solid #ffd7e0;
  border-radius: 16px;
  box-shadow: 0 4px 10px rgba(255, 182, 193, 0.2);
  max-width: 700px;
  margin: auto;
  padding: 30px;
  line-height: 1.8;
}

h1 {
  color: #ff6b9a;
  text-align: center;
  border-bottom: 3px dotted #ffd1dc;
  padding-bottom: 10px;
}

h2 {
  color: #ff94b8;
  border-left: 6px solid #ffd1dc;
  padding-left: 10px;
}

p {
  background: #fff0f5;
  padding: 10px 15px;
  border-radius: 10px;
  border-left: 4px solid #ffb6c1;
}

button {
  background: #ffb6c1;
  border: none;
  padding: 10px 20px;
  color: white;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 10px;
}
button:hover {
  background: #ff94b8;
}
</style>
</head>

<body>
  <div class="container">
    <h1>図書館情報技術論</h1>

    <h2>夏休みにやったこと</h2>
    <p>夏休みは家で、メロンパンやチョコパンなど、初めてのパン作りに挑戦してみました。</p>
    
  </div>
</body>
</html>
